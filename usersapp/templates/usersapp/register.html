{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body">
                <h1 class="card-title mb-4 text-danger">Create Account</h1>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-danger mt-3">Register</button>
                </form>
                <div class="mt-3 text-center">
                    <p class="mb-0">Already have an account? 
                        <a href="{% url 'usersapp:login' %}" class="text-danger">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
