<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="{% url 'events:home' %}" class="text-decoration-none text-dark">Welcome To EventHub</a></h1>
        <nav>
            <ul>
                {% if user.is_authenticated %}
                <li><a href="{% url 'usersapp:logout' %}">Logout</a></li>
                <li><a href="{% url 'usersapp:profile' user.username %}">Profile</a></li>
                <li><a href="{% url 'events:create_event' %}">Create Event</a></li>
                {% else %}
                <li><a href="{% url 'usersapp:register' %}">Register</a></li>
                <li><a href="{% url 'usersapp:login' %}">Login</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2025 EventHub</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
